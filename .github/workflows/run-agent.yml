# Запуск агента opencode в одноразовой GHA-джобе.
#
# В inputs диспатча — только `run_id` и `claim_token`. Ни промпта, ни ключа LLM, ни
# имени репозитория здесь быть не должно: `workflow_dispatch` публичного репозитория
# показывает inputs в метаданных прогона, и всё, что туда попало, читает любой.
# Всё остальное джоба забирает у шлюза одноразовым claim'ом (см. src/claim.ts).
name: run-agent

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Идентификатор рана (эхо в ответе шлюзу)
        required: true
        type: string
      claim_token:
        description: Одноразовый токен обмена на spec + llmKey. Глохнет после первого claim'а
        required: true
        type: string

# Двойной запуск одного рана запустит две джобы с одним claim-токеном: вторая
# отобьётся на claim (409) и выйдет, первая сделает работу. Но лишние минуты никому
# не нужны — конкурентный запуск того же workflow отменяем.
concurrency:
  group: run-agent-${{ inputs.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  run:
    # Страховка сверху: `limits.timeoutMs` жмёт агента, а этот потолок — всю джобу
    # вместе с клоном, установкой opencode и пушем артефактов. +10 минут на них.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      GCS_WORKLOAD_PROVIDER: ${{ vars.GCS_WORKLOAD_PROVIDER }}
      GCS_SERVICE_ACCOUNT: ${{ vars.GCS_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and unit tests
        run: npm ci --no-audit --no-fund && npm run build && npm test

      # Аутентификация в GCP для выгрузки лога сессии. Workload Identity Federation:
      # у секрета нет приватного ключа, только имя провайдера и сервис-аккаунта.
      - name: Auth to Google Cloud
        if: env.GCS_WORKLOAD_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCS_WORKLOAD_PROVIDER }}
          service_account: ${{ env.GCS_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: env.GCS_WORKLOAD_PROVIDER != ''
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: '>= 363.0.0'

      # Бинарь ставится до создания идентичности и делается world-readable, чтобы
      # агент мог его исполнить под своим UID, но не мог переписать.
      - name: Install pinned OpenCode fork
        env:
          OPENCODE_RELEASE_TAG: mem-preview-20261013-d8cdc0166446
          OPENCODE_VERSION: 0.0.0-mem-preview.d8cdc0166446
          OPENCODE_SOURCE_SHA: d8cdc0166446e19b51ab56e23980b00cf33e5f73
          OPENCODE_ARCHIVE_SHA256: 5c15dcfcb0c20c49fa89809ab479fae8c99774c382ef6d200a98bfc61190ea75
          OPENCODE_BINARY_SHA256: db778e43c0657c854c43fbc6d65a48dc9cbc50af86cc006fa77efe9cc86aee74
        run: |
          set -euo pipefail
          asset="opencode-linux-x64.tar.gz"
          url="https://github.com/gpt-mem/opencode-mem/releases/download/${OPENCODE_RELEASE_TAG}/${asset}"
          curl --fail --location --silent --show-error "$url" --output "$RUNNER_TEMP/$asset"
          echo "$OPENCODE_ARCHIVE_SHA256  $RUNNER_TEMP/$asset" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/opencode-fork"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/opencode-fork"
          test -x "$RUNNER_TEMP/opencode-fork/opencode"
          echo "$OPENCODE_BINARY_SHA256  $RUNNER_TEMP/opencode-fork/opencode" | sha256sum --check --status
          sudo install -o root -g root -m 0755 "$RUNNER_TEMP/opencode-fork/opencode" /usr/local/bin/opencode
          version="$(opencode --version)"
          test "$version" = "$OPENCODE_VERSION"
          echo "::notice title=OpenCode fork::version=$version source=$OPENCODE_SOURCE_SHA sha256=$OPENCODE_BINARY_SHA256"
          opencode --version

      - name: Run agent
        env:
          GATEWAY_URL: ${{ vars.GATEWAY_URL }}
          RUN_ID: ${{ inputs.run_id }}
          CLAIM_TOKEN: ${{ inputs.claim_token }}
          ARTIFACTS_TOKEN: ${{ secrets.ARTIFACTS_TOKEN }}
          LOG_UPLOAD: ${{ vars.LOG_UPLOAD || 'gcs' }}
          GCS_LOG_BUCKET: ${{ vars.GCS_LOG_BUCKET }}
          GCS_PROFILE_BUCKET: ${{ vars.GCS_PROFILE_BUCKET }}
          WORKSPACE_ROOT: ${{ runner.temp }}
          AGENT_ARGS: ${{ vars.AGENT_ARGS }}
          AGENT_CONFIG: ${{ vars.AGENT_CONFIG }}
          # Passwordless sudo — штатное свойство GitHub-hosted раннера, поэтому
          # per_run_unix_identity ставится по-настоящему, а не имитируется.
          ALLOW_SUDO: 'true'
        run: node dist/src/runner/main.js

      - name: Publish session log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-log-${{ inputs.run_id }}
          path: ${{ runner.temp }}/session-logs/${{ inputs.run_id }}/session.log
          retention-days: 3
          if-no-files-found: ignore
