name: verify-opencode-preview

on:
  pull_request:
    paths:
      - .github/workflows/run-agent.yml
      - .github/workflows/verify-opencode-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-linux-binary:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned OpenCode MEM preview
        env:
          OPENCODE_PREVIEW_TAG: mem-preview-20261013-a6c8f6632c9b
          OPENCODE_PREVIEW_VERSION: 0.0.0-mem-preview.a6c8f6632c9b
          OPENCODE_PREVIEW_SHA256: cf7b44cae53a5f3c6b9341690bfe94d1341b562a6179fe552987163fe963d6e5
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/opencode"
          curl --fail --location --retry 3 --retry-delay 1 \
            "https://github.com/gpt-mem/opencode-mem/releases/download/${OPENCODE_PREVIEW_TAG}/opencode-linux-x64" \
            --output "$binary"
          echo "${OPENCODE_PREVIEW_SHA256}  ${binary}" | sha256sum --check
          chmod 0755 "$binary"
          test "$("$binary" --version)" = "$OPENCODE_PREVIEW_VERSION"
