name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify

  opencode-fork-linux-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify pinned OpenCode MEM preview
        env:
          OPENCODE_RELEASE_TAG: mem-preview-20261013-d8cdc0166446
          OPENCODE_VERSION: 0.0.0-mem-preview.d8cdc0166446
          OPENCODE_SOURCE_SHA: d8cdc0166446e19b51ab56e23980b00cf33e5f73
          OPENCODE_ARCHIVE_SHA256: 5c15dcfcb0c20c49fa89809ab479fae8c99774c382ef6d200a98bfc61190ea75
          OPENCODE_BINARY_SHA256: db778e43c0657c854c43fbc6d65a48dc9cbc50af86cc006fa77efe9cc86aee74
        run: |
          set -euo pipefail
          asset="opencode-linux-x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gpt-mem/opencode-mem/releases/download/${OPENCODE_RELEASE_TAG}/${asset}" \
            --output "$RUNNER_TEMP/$asset"
          echo "$OPENCODE_ARCHIVE_SHA256  $RUNNER_TEMP/$asset" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/opencode-fork"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/opencode-fork"
          test -x "$RUNNER_TEMP/opencode-fork/opencode"
          echo "$OPENCODE_BINARY_SHA256  $RUNNER_TEMP/opencode-fork/opencode" | sha256sum --check --status
          version="$("$RUNNER_TEMP/opencode-fork/opencode" --version)"
          test "$version" = "$OPENCODE_VERSION"
          echo "OpenCode Linux x64 smoke passed: version=$version source=$OPENCODE_SOURCE_SHA sha256=$OPENCODE_BINARY_SHA256" >> "$GITHUB_STEP_SUMMARY"
